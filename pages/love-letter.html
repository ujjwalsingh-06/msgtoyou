<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Love Letter ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../style.css">

    <link rel="stylesheet" href="../css/animations.css">

    <link rel="stylesheet" href="../css/letter.css">

</head>

<body>

    <!-- Background -->

    <div class="letter-bg"></div>

    <!-- Hearts -->

    <div class="floating-hearts"></div>

    <!-- Main -->

    <main class="letter-page">

        <h1>

            A Letter For You ❤️

        </h1>

        <p class="subtitle">

            Open the envelope...

        </p>

        <!-- Envelope -->

        <div id="envelope">

            <div class="envelope-top"></div>

            <div class="envelope-body"></div>

            <div class="heart-seal">

                ❤️

            </div>

        </div>

        <!-- Letter -->

        <div id="letter">

            <div class="paper">

                <h2>

                    My Dearest Vrityanshi ❤️

                </h2>

                <div id="letterText"></div>

            </div>

        </div>

        <!-- Back -->

        <a href="../index.html"
            class="back-btn">

            ← Back To Home

        </a>

    </main>

    <script src="../js/letter.js"></script>

</body>

</html>
